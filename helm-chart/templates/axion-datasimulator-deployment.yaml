apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
spec:
  replicas: {{ .Values.axiondataSimulator.replicaCount }}
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: "{{ .Values.axiondataSimulator.image.repository }}:{{ .Values.axiondataSimulator.image.tag }}"
          ports:
            - containerPort: {{ .Values.axiondataSimulator.containerPort }}
