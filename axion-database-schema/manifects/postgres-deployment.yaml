apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgressql
        image: postgres:17.0-alpine
        ports:
        - containerPort: 5432
        env:
          - name: POSTGRES_USER
            value: "axion_user"
          - name: POSTGRES_PASSWORD
            value: "P@ssw01rd@123"
          - name: POSTGRES_DB
            value: "axion_db"
